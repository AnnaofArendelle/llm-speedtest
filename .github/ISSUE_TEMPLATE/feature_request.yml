name: Feature request
description: Suggest a metric, probe, dialect or UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to measure or understand?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Reference other tools or papers if relevant.
