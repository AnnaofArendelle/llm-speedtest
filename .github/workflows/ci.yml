name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  web:
    name: Web UI (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 7

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  go-test:
    name: Go test (${{ matrix.os }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Test with race detector and coverage gate
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/coverage.sh
      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: go test -count=1 ./...
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Release build (snapshot)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Package the AI skill
        run: ./scripts/package-skill.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - name: Smoke test the binary
        run: |
          bin=$(find dist -type f -path '*linux_amd64*' -name 'llm-speedtest' | head -n1)
          "$bin" version
          "$bin" skill show >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            build/llm-speedtest-skill.zip
          retention-days: 7

  e2e:
    name: End-to-end (Playwright against serve --demo)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build the server with the embedded UI
        run: go build -trimpath -o bin/llm-speedtest ./cmd/llm-speedtest
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start the demo server
        run: |
          ./bin/llm-speedtest serve --demo --listen 127.0.0.1:8790 --data-dir "$RUNNER_TEMP/lst" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8790/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8790/healthz
      - run: npm run e2e
        working-directory: web
        env:
          LST_BASE_URL: http://127.0.0.1:8790
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/serve.log
          retention-days: 7

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  skill:
    name: Skill package & shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh skills/llm-speedtest/scripts/*.sh
      - name: Validate and export the skill
        run: |
          go run ./cmd/llm-speedtest skill show
          ./scripts/package-skill.sh
          unzip -l build/llm-speedtest-skill.zip

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
